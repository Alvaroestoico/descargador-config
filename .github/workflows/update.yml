name: Actualizar clients.json desde yt-dlp
on:
  schedule:
    - cron: '17 5 * * *'   # cada día, 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@{"message":"Not Found","documentation_url":"https://docs.github.com/rest/git/tags#get-a-tag","status":"404"}  # v4
      - uses: actions/setup-python@{"message":"Not Found","documentation_url":"https://docs.github.com/rest/git/tags#get-a-tag","status":"404"}  # v5
        with:
          python-version: '3.12'
      - run: pip install -U yt-dlp
      - name: Generar
        run: python scripts/gen_clients.py > new.json
      - name: Guardar solo si cambian los clientes
        run: |
          if python -c "import json,sys; a=json.load(open('clients.json')); b=json.load(open('new.json')); sys.exit(0 if a['clients']==b['clients'] else 1)"; then
            echo "Sin cambios en los clientes"; rm new.json; exit 0
          fi
          mv new.json clients.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients.json
          git commit -m "clients.json: yt-dlp $(python -c "import json;print(json.load(open('clients.json'))['ytdlp'])")"
          git push
